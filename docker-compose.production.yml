services:
  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --set
      - log_retention_ms=604800000
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_fog
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic-demo-pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_fog"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloud-storage-consumer:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: python -m tools.cloud_storage_consumer --bootstrap redpanda:9092
    volumes:
      - app-state:/app/state
      - app-backups:/app/backups
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  digital-twin-service:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: python -m services.digital_twin_service --bootstrap redpanda:9092
    volumes:
      - app-state:/app/state
      - app-backups:/app/backups
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  governance-consumer:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: python -m tools.governance_consumer --bootstrap redpanda:9092
    volumes:
      - app-state:/app/state
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: python -m tools.dashboard
    ports:
      - "8050:8050"
    volumes:
      - app-state:/app/state
      - ./data:/app/data
    depends_on:
      - cloud-storage-consumer
      - digital-twin-service

  backup:
    build: .
    restart: "no"
    env_file: .env.production
    command: python -m tools.backup_sqlite
    volumes:
      - app-state:/app/state:ro
      - app-backups:/app/backups

volumes:
  redpanda-data:
  postgres-data:
  app-state:
  app-backups:
